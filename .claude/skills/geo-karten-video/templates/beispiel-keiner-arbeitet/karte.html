  <script>
    const tl = gsap.timeline({ paused: true });
    const CX = 540, CY = 900;
    const cam = (px, py, s) => ({ x: CX - px * s, y: CY - py * s, scale: s });
    const pop = (sel, t, from = 0) => tl.fromTo(sel, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, t);
    const out = (sel, t) => tl.to(sel, { scale: 0, opacity: 0, duration: 0.22, ease: "power3.in" }, t);

    // Kamera: eine durchgehende Fahrt wie in den Referenzen, keine harten Schnitte
    tl.set("#k-cam", cam(2230, 1975, 0.95), 0);
    tl.to("#k-cam", { ...cam(2230, 1975, 1.12), duration: 3.5, ease: "sine.inOut" }, 0);
    tl.to("#k-cam", { ...cam(2235, 1990, 1.2), duration: 3.6, ease: "sine.inOut" }, 3.6);
    tl.to("#k-cam", { ...cam(2360, 1740, 1.5), duration: 0.8, ease: "power2.inOut" }, 7.25);
    tl.to("#k-cam", { ...cam(2140, 2200, 1.5), duration: 0.8, ease: "power2.inOut" }, 10.5);
    tl.to("#k-cam", { ...cam(2235, 1990, 1.15), duration: 0.8, ease: "power2.inOut" }, 15.25);
    tl.to("#k-cam", { ...cam(2235, 2060, 1.02), duration: 0.8, ease: "power2.inOut" }, 18.25);
    tl.to("#k-cam", { ...cam(2235, 2000, 0.5), duration: 1.6, ease: "power2.inOut" }, 24.75);
    tl.to("#k-cam", { ...cam(2235, 2000, 0.47), duration: 2.7, ease: "none" }, 26.35);

    // Deutschland: ploppt blass auf und faerbt sich, wird Tag fuer Tag grauer, bei "null" rot
    tl.set("#k-de-fill", { fill: "#2f5bea", fillOpacity: 0.66 }, 0);
    tl.to("#k-de-fill", { fill: "#3b55b8", duration: 0.6 }, 7.4);
    tl.to("#k-de-fill", { fill: "#56598a", duration: 0.6 }, 10.7);
    tl.to("#k-de-fill", { fill: "#77566a", duration: 0.6 }, 15.45);
    tl.to("#k-de-fill", { fill: "#e02424", fillOpacity: 0.74, duration: 0.12 }, 24.05);

    // Hook: Arbeiter stehen auf Deutschland, bei "KEINER" verschwinden sie -> Bett + zzz
    tl.fromTo(["#h-w1", "#h-w2", "#h-w3"], { y: 0 }, { y: -18, duration: 0.5, ease: "sine.inOut", stagger: 0.12, yoyo: true, repeat: 3 }, 0.0);
    out(["#h-w1", "#h-w3", "#h-w2"], 2.18);
    pop("#h-bett", 2.3); pop("#h-zzz", 2.62);
    tl.fromTo("#h-zzz", { y: 0, rotation: 0 }, { y: -40, rotation: 8, duration: 1.0, ease: "sine.inOut" }, 2.7);
    out(["#h-bett", "#h-zzz"], 3.5);

    // Label "Deutschland"
    tl.fromTo("#k-label-de-t", { scale: 0.6, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -10, duration: 0.5, ease: "back.out(2)" }, 3.9);
    tl.to("#k-label-de-t", { opacity: 0, duration: 0.2 }, 5.0);

    // 46 Millionen: Menschen ploppen in allen Staedten auf, Zahl zaehlt hoch
    document.querySelectorAll("#g-46 .st").forEach((el, i) => pop(el, 5.2 + i * 0.045));
    out("#g-46 .st", 7.15);
    const n46 = { v: 0 };
    tl.fromTo("#s-46-in", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 5.15);
    tl.fromTo(n46, { v: 0 }, { v: 46, duration: 1.0, ease: "power2.out", onUpdate: () => { document.getElementById("s-46-n").textContent = Math.round(n46.v); } }, 5.2);
    tl.to("#s-46-in", { scale: 0.6, opacity: 0, duration: 0.2, ease: "power3.in" }, 7.1);

    // Tag-Labels
    for (const [id, t0, t1] of [["#s-tag1", 7.45, 10.3], ["#s-tag3", 10.7, 15.0], ["#s-tag7", 15.45, 18.05]]) {
      tl.fromTo(id + " span", { scale: 1.6, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out" }, t0);
      tl.to(id + " span", { opacity: 0, scale: 0.8, duration: 0.18, ease: "power2.in" }, t1);
    }

    // Tag 1: Bus und Zug fahren, bei "STILL" bleiben sie stehen
    pop("#t1-bus", 8.7);
    tl.fromTo("#t1-bus", { x: -90 }, { x: 0, duration: 1.2, ease: "power2.out" }, 8.7);
    pop("#t1-zug", 9.45);
    tl.fromTo("#t1-zug", { x: -160 }, { x: 40, duration: 0.5, ease: "power3.out" }, 9.45);
    pop("#t1-stop1", 9.9); pop("#t1-stop2", 9.98);
    out(["#t1-bus", "#t1-zug", "#t1-stop1", "#t1-stop2"], 10.4);

    // Tag 3: Einkaufswagen leer, Laster kommt nicht an
    pop("#t3-wagen", 12.3);
    tl.fromTo("#t3-x1", { scale: 2.2, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.25, ease: "power4.out" }, 12.95);
    tl.fromTo("#t3-lkw", { x: -420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 13.55);
    tl.fromTo("#t3-x2", { scale: 2.2, opacity: 0, rotation: 20 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.25, ease: "power4.out" }, 14.25);
    out(["#t3-wagen", "#t3-x1", "#t3-lkw", "#t3-x2"], 15.05);

    // Tag 7: Muell stapelt sich ueberall, Ratten
    document.querySelectorAll("#g-tag7 [id^=mu-]").forEach((el, i) => pop(el, 16.2 + i * 0.05));
    document.querySelectorAll("#g-tag7 [id^=ra-]").forEach((el, i) => pop(el, 17.5 + i * 0.07));
    out("#g-tag7 .st", 18.05);

    // Geld: Scheine fliegen, 12 Milliarden pro Tag -> bei "NULL" auf 0, rot
    document.querySelectorAll("#g-geld .st").forEach((el, i) => {
      pop(el, 18.7 + i * 0.09);
      tl.fromTo(el, { y: 0 }, { y: -60 - (i % 3) * 20, duration: 5.2, ease: "sine.inOut" }, 18.8);
    });
    const n12 = { v: 0 };
    tl.fromTo("#s-geld-in", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 21.2);
    tl.fromTo(n12, { v: 0 }, { v: 12, duration: 0.9, ease: "power2.out", onUpdate: () => { document.getElementById("s-geld-n").textContent = Math.round(n12.v); } }, 21.25);
    out("#g-geld .st", 23.6);
    tl.fromTo(n12, { v: 12 }, { v: 0, duration: 0.5, ease: "power2.in", immediateRender: false, onUpdate: () => { document.getElementById("s-geld-n").textContent = Math.round(n12.v); } }, 23.55);
    tl.set("#s-geld-n", { color: "#ff3b3b" }, 24.05);
    tl.set("#s-geld-u", { textContent: "EURO" }, 24.05);
    tl.fromTo("#s-geld-in", { scale: 1.25 }, { scale: 1, duration: 0.35, ease: "power4.out", immediateRender: false }, 24.05);
    tl.to("#s-geld-in", { opacity: 0, scale: 0.7, duration: 0.2, ease: "power2.in" }, 24.6);
    tl.fromTo("#k-shake", { x: 0 }, { x: 14, duration: 0.04, yoyo: true, repeat: 7, ease: "none" }, 24.05);
    tl.set("#k-shake", { x: 0 }, 24.4);

    // Ende: rausfahren nach Europa, Deutschland rot, nachdenkliches Gesicht
    pop("#e-denk", 25.1);
    tl.fromTo("#e-label", { scale: 0.6, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.5, ease: "back.out(2)" }, 25.5);

    window.__timelines["karte"] = tl;
  </script>
