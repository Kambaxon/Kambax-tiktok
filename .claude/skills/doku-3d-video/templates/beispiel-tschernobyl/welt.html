  <script>
    (function () {

      // ---------- Helfer ----------

      // Deterministische Partikel: Position = Basis + Geschwindigkeit * Lebensphase

      (function () {

      // ===== 3. Kontrollraum Block 4, 1:23 Uhr =====
      (function () {
        const s = new THREE.Scene(); s.background = new THREE.Color(0x1c2420);
