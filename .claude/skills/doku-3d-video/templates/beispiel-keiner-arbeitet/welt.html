  <style>

  <script>
    (function () {

        { id: "klinik", t0: 21.67, t1: 27.99 },
        { id: "muell", t0: 27.99, t1: 35.11 },
        { id: "nacht", t0: 35.11, t1: 40.93 },
        { id: "kueche", t0: 40.93, t1: 46.11 },
        { id: "nacht", t0: 46.11, t1: 68.3, hold: true },
        { id: "ende", t0: 68.3, t1: 77.0 },
      ];
      const DUR = 77.0;

      // ---------- Helfer ----------
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
      const lerp = (a, b, k) => a + (b - a) * k;
      const lerpV = (a, b, k) => new THREE.Vector3(lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k));
      const M = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.82, metalness: 0 }, o));
      function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z);

      }
      function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, parent, seg = 20) {

      }
      function skyTex(top, mid, bottom) {

      }
      function windowsTex(cols, rows, wall, lit, seed, litShare = 0.75) {

          g.fillStyle = wall; g.fillRect(0, 0, w, h);
          const cw = w / cols, rh = h / rows;
          for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
            g.fillStyle = r() < litShare ? lit : "#2a3340";
            g.fillRect(i * cw + cw * 0.22, j * rh + rh * 0.2, cw * 0.56, rh * 0.55);

        });
      }

      // Gliederpuppen-Figur wie in den Referenzen (glatte Formen, einfarbige Kleidung)
      const SKIN = [0xf1c7a3, 0xd9a47c, 0xb57a52, 0x8a5a3c, 0xf5d5bb];
      const CLOTH = [0x2f4f8f, 0xc23b3b, 0x3f7d4f, 0xe0b23a, 0x6b4c9a, 0x2b2b30, 0xe8e2d6, 0x1f6f8b, 0xd9708a];
      const HAIR = [0x2a1c12, 0x5a3a1e, 0x9a6a32, 0x161616, 0xcaa46a];
      function person(seed, o = {}) {
        const r = rng(seed); const g = new THREE.Group();
        const skin = M(SKIN[Math.floor(r() * SKIN.length)]);
        const top = M(o.top ?? CLOTH[Math.floor(r() * CLOTH.length)]);
        const pants = M(o.pants ?? [0x2b3446, 0x3a3a3a, 0x5b4a36, 0x23364f][Math.floor(r() * 4)]);

        const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.19, 0.42, 6, 14), top);

        const armGeo = new THREE.CapsuleGeometry(0.058, 0.56, 4, 10);

        armL.position.y = -0.31; armR.position.y = -0.31; shL.add(armL); shR.add(armR);
        const handL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), skin); handL.position.y = -0.64; shL.add(handL);
        const handR = handL.clone(); shR.add(handR);
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.1, 10), skin); neck.position.y = 1.53;

      }
      function idle(p, t) { // leichtes Gewicht-Verlagern, nie synchron

        u.head.rotation.y = Math.sin(k * 0.4) * 0.25; p.rotation.z = Math.sin(k * 0.5) * 0.015;
      }
      function walk(p, t, speed = 1) {
        const u = p.userData, k = t * 6 * speed + u.phase, a = Math.sin(k) * 0.45;
        u.hipL.rotation.x = a; u.hipR.rotation.x = -a; u.shL.rotation.x = -a * 0.8; u.shR.rotation.x = a * 0.8;

      function sun(scene, color, intensity, pos, size = 14) {

      // ===== 1. Schlafzimmer: Wecker auf dem Nachttisch, 7:00 =====
      (function () {

          g.fillStyle = "#222"; g.font = "bold 34px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
          for (let i = 1; i <= 12; i++) { const a = (i / 12) * Math.PI * 2; g.fillText(String(i), 128 + Math.sin(a) * 96, 128 - Math.cos(a) * 96); }
          g.lineCap = "round"; g.strokeStyle = "#222"; g.lineWidth = 9; g.beginPath(); g.moveTo(128, 128); g.lineTo(128 + Math.sin(Math.PI * 2 * 7 / 12) * 55, 128 - Math.cos(Math.PI * 2 * 7 / 12) * 55); g.stroke();
          g.lineWidth = 6; g.beginPath(); g.moveTo(128, 128); g.lineTo(128, 40); g.stroke();
          g.fillStyle = "#c9322b"; g.beginPath(); g.arc(128, 128, 8, 0, 7); g.fill();
        });
        const faceM = new THREE.Mesh(new THREE.CircleGeometry(0.095, 40), new THREE.MeshStandardMaterial({ map: face, roughness: 0.5 }));
        faceM.position.z = 0.031; clock.add(faceM);

        const c = cam();
        W.zimmer = { scene: s, camera: c, update(t) {

      })();

      // ===== 2. Haltestelle: viele warten, die Strasse bleibt leer =====
      (function () {

        // Haeuserzeilen

          const b = box(w, h, 8, M(0xffffff, { map: tex }), side * (11 + r() * 1.5), h / 2, 2 - i * 9.5, s);

        const hs = new THREE.Mesh(new THREE.CircleGeometry(0.36, 40), new THREE.MeshStandardMaterial({ map: hT, side: THREE.DoubleSide })); hs.position.set(2.4, 3.0, 0.62); hs.rotation.y = 0.5; shel.add(hs);
        // Wartende

        spots.forEach(([x, z], i) => { const p = person(100 + i); p.position.set(x, 0.18, z); p.rotation.y = -0.9 + (i % 3) * 0.15; s.add(p); crowd.push(p); });
        // geparkter, dunkler Bus weit hinten (faehrt nicht)
        const bus = new THREE.Group(); s.add(bus); bus.position.set(2.2, 0, -46);
        box(2.5, 2.9, 11, M(0xf2c500, { roughness: 0.5 }), 0, 1.75, 0, bus); box(2.52, 0.9, 10.6, M(0x24303a, { roughness: 0.2 }), 0, 2.3, 0, bus);
        [[-1.1, -3.6], [1.1, -3.6], [-1.1, 3.6], [1.1, 3.6]].forEach(([x, z]) => { const w = cyl(0.5, 0.5, 0.3, M(0x1a1a1a), x, 0.5, z, bus); w.rotation.z = Math.PI / 2; });

        } };

      // ===== 3. Supermarkt: leere Regale =====
      (function () {
        const s = new THREE.Scene(); s.background = new THREE.Color(0xe9edf0);
        s.add(new THREE.HemisphereLight(0xffffff, 0x9aa0a6, 1.0)); sun(s, 0xffffff, 1.2, [3, 10, 4], 12);
        const tiles = canvasTex(256, 256, (g, w, h) => { g.fillStyle = "#dfe3e6"; g.fillRect(0, 0, w, h); g.strokeStyle = "#c3c9cd"; g.lineWidth = 4; for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); } });
        tiles.wrapS = tiles.wrapT = THREE.RepeatWrapping; tiles.repeat.set(10, 20);
        box(20, 0.1, 40, M(0xffffff, { map: tiles, roughness: 0.35 }), 0, -0.05, -10, s);
        box(20, 0.1, 40, M(0xf4f6f7), 0, 4.2, -10, s);

        const r = rng(33); const prodCols = [0xe24a3b, 0xf2b632, 0x3b8fe2, 0x4fb36b, 0xffffff, 0xe27a3b];

        const cart = new THREE.Group(); s.add(cart); cart.position.set(0.25, 0, -7.4);

        box(0.6, 0.45, 0.85, M(0xb9c2c8, { metalness: 0.6, roughness: 0.3, transparent: true, opacity: 0.55 }), 0, 0.75, 0, cart);
        box(0.62, 0.04, 0.04, wire, 0, 1.0, 0.47, cart);

          const dt = T - 44.3; drop.visible = dt > 0 && dt < 0.5; drop.position.set(0.3, 1.24 - (dt > 0 ? 4.9 * dt * dt : 0), -0.73);
          idle(you, t); you.userData.shR.rotation.x = -1.0; you.userData.head.rotation.x = 0.4; you.userData.head.rotation.y = 0;
        } };
      })();

      function renderAt(T) {
        let sh = SHOTS[SHOTS.length - 1];
        for (const x of SHOTS) if (T >= x.t0 && T < x.t1) { sh = x; break; }
        const w = W[sh.id]; if (sh.hold) w.update(99, 99); else w.update(T - sh.t0, T);
        renderer.render(w.scene, w.camera);
      }
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__timelines["welt"] = tl;
    })();
  </script>
