<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #lk-grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: 0.075; mix-blend-mode: overlay; }
    #lk-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 62% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
    #lk-flash { position: absolute; inset: 0; background: #fff6e6; opacity: 0; }
    #lk-black { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>
  <div id="root" data-composition-id="look" data-width="1080" data-height="1920" data-layout-ignore>
    <canvas id="lk-grain" width="360" height="640"></canvas>
    <div id="lk-vig"></div>
    <div id="lk-flash"></div>
    <div id="lk-black"></div>
  </div>
  <script>
    // Filmkorn, Vignette, Aufhellung durch die Feuerkugel, Einschlagsblitz 16.68 s, Schluss-Abblende
    const cv = document.getElementById("lk-grain"), g = cv.getContext("2d"), img = g.createImageData(360, 640);
    function grain(frame) {
      let s = (frame * 2654435761) >>> 0;
      for (let i = 0; i < img.data.length; i += 4) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; const v = (s >>> 0) & 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
      g.putImageData(img, 0, 0);
    }
    const st = { t: 0 }; let last = -1;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(st, { t: 0 }, { t: 74, duration: 74, ease: "none", onUpdate: () => { const f = Math.floor(st.t * 15); if (f !== last) { grain(f); last = f; } } }, 0);
    tl.fromTo("#lk-flash", { opacity: 0 }, { opacity: 0.35, duration: 3.3, ease: "power2.in" }, 13.2);
    tl.to("#lk-flash", { opacity: 0, duration: 0.1 }, 16.5);
    tl.to("#lk-flash", { opacity: 1, duration: 0.03, ease: "none" }, 16.66);
    tl.to("#lk-flash", { opacity: 0, duration: 1.4, ease: "power2.out" }, 16.8);
    tl.fromTo("#lk-black", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power1.in" }, 72.5);
    grain(0);
    window.__timelines["look"] = tl;
  </script>
</template>
