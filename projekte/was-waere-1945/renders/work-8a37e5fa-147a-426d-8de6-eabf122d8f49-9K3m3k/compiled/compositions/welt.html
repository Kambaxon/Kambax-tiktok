<template>
  <style>

  <script>
    (function () {
      // ---------- Zeitplan der Einstellungen (Sekunden, Root-Zeit) ----------
      const SHOTS = [
        { id: "ruinen", t0: 0.0, t1: 9.4 },

        { id: "befreiung", t0: 62.6, t1: 67.2 },
        { id: "ende", t0: 67.2, t1: 75.5 },
      ];
      const DUR = 75.5;

      // ---------- Helfer ----------
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
      const lerp = (a, b, k) => a + (b - a) * k;
      const lerpV = (a, b, k) => new THREE.Vector3(lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k));

      }
      function skyTex(top, mid, bottom) {
        return canvasTex(8, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, top); gr.addColorStop(0.55, mid); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
      }
      function windowsTex(cols, rows, wall, lit, seed, litShare = 0.75) {
        const r = rng(seed);
        return canvasTex(256, 512, (g, w, h) => {
          g.fillStyle = wall; g.fillRect(0, 0, w, h);
          const cw = w / cols, rh = h / rows;

      // Gliederpuppen-Figur wie in den Referenzen (glatte Formen, einfarbige Kleidung)
      const SKIN = [0xf1c7a3, 0xd9a47c, 0xb57a52, 0x8a5a3c, 0xf5d5bb];
      const CLOTH = [0x2f4f8f, 0xc23b3b, 0x3f7d4f, 0xe0b23a, 0x6b4c9a, 0x2b2b30, 0xe8e2d6, 0x1f6f8b, 0xd9708a];
      const HAIR = [0x2a1c12, 0x5a3a1e, 0x9a6a32, 0x161616, 0xcaa46a];
      function person(seed, o = {}) {
        const r = rng(seed); const g = new THREE.Group();

        torso.position.y = 1.18; torso.scale.set(1, 1, 0.68);
        const armGeo = new THREE.CapsuleGeometry(0.058, 0.56, 4, 10);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 16), skin); head.position.y = 1.68; head.scale.set(1, 1.12, 1);
        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.137, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hair);
        cap.position.y = 1.7; cap.rotation.x = -0.25;
        [legL, legR, torso, armL, armR, head, cap, neck, handL, handR].forEach((m) => { m.castShadow = true; m.receiveShadow = true; });

        return g;
      }
      function idle(p, t) { // leichtes Gewicht-Verlagern, nie synchron

        const u = p.userData, k = t * 6 * speed + u.phase, a = Math.sin(k) * 0.45;

      function sun(scene, color, intensity, pos, size = 14) {

      }
      function cam() { return new THREE.PerspectiveCamera(46, 1080 / 1920, 0.1, 400); }

      // ---------- Renderer ----------

      renderer.localClippingEnabled = true; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      function smokeColumn(s, x, z, seed, n = 14, col = 0x3a3634) {

      // ===== 1. Berlin in Truemmern, Abendrot =====
      (function () {
        const s = new THREE.Scene(); s.background = skyTex("#2b2a33", "#8a4f3c", "#d08a5c"); s.fog = new THREE.Fog(0x8a6655, 25, 140);

        };

        for (let i = 0; i < 160; i++) { const g = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3 + r() * 1.4, 0), M([0x6b625a, 0x7d736a, 0x4f4943][i % 3])); g.position.set((r() - 0.5) * 34, 0.2, 4 - r() * 100); g.rotation.set(r() * 3, r() * 3, r() * 3); g.scale.y = 0.5; g.castShadow = g.receiveShadow = true; s.add(g); }
        const smokes = [smokeColumn(s, -14, -40, 1), smokeColumn(s, 16, -70, 2), smokeColumn(s, -4, -95, 3, 12)];
        const you = person(45, { top: 0x4a4038, pants: 0x2b2b30 }); you.position.set(0.9, 0, -1.5); you.rotation.y = Math.PI; s.add(you);
        const c = cam();

          smokes.forEach((f) => f(t + 20)); idle(you, t);

      })();

      // ===== 2. Wohnung 1950: Volksempfaenger, Schatten vor dem Fenster =====
      (function () {
        const s = new THREE.Scene(); s.background = new THREE.Color(0x1a1612);
        s.add(new THREE.HemisphereLight(0x8fa3c8, 0x2a2018, 0.35));
        const lamp = new THREE.PointLight(0xffc27a, 2.4, 9, 2); lamp.position.set(-0.6, 2.1, -0.2); lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); s.add(lamp);
        const paper = canvasTex(128, 128, (g) => { g.fillStyle = "#6f6a4c"; g.fillRect(0, 0, 128, 128); g.fillStyle = "#5e5a40"; for (let i = 0; i < 8; i++) g.fillRect(i * 16, 0, 6, 128); });
        paper.wrapS = paper.wrapT = THREE.RepeatWrapping; paper.repeat.set(6, 2);
        box(10, 0.1, 10, M(0x4a3524), 0, -0.05, 0, s);
        box(10, 3.2, 0.2, M(0xffffff, { map: paper }), 0, 1.6, -2, s); box(0.2, 3.2, 10, M(0xffffff, { map: paper }), -3, 1.6, 0, s);
        // Fenster mit Nachtlicht, Silhouette laeuft vorbei
        const win = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.6), new THREE.MeshBasicMaterial({ color: 0x3b5a8a })); win.position.set(1.3, 1.75, -1.89); s.add(win);
        box(1.5, 0.08, 0.1, M(0xd8cfbf), 1.3, 1.75, -1.86, s); box(0.08, 1.7, 0.1, M(0xd8cfbf), 1.3, 1.75, -1.86, s);
        const coat = new THREE.Group(); coat.position.set(0, 0.62, -1.893); coat.scale.set(0.6, 0.6, 0.6); s.add(coat);
        const clip = [new THREE.Plane(new THREE.Vector3(1, 0, 0), -0.6), new THREE.Plane(new THREE.Vector3(-1, 0, 0), 2.0), new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.95), new THREE.Plane(new THREE.Vector3(0, -1, 0), 2.55)];
        const cm = new THREE.MeshBasicMaterial({ color: 0x0b1018, clippingPlanes: clip });
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 1.0, 4, 10), cm); body.position.y = 1.45; coat.add(body);
        const hd = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), cm); hd.position.y = 2.25; coat.add(hd);
        const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.03, 16), cm); brim.position.y = 2.36; coat.add(brim);
        const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.16, 16), cm); crown.position.y = 2.45; coat.add(crown);
        // Tisch + Volksempfaenger
        box(1.6, 0.06, 0.9, M(0x6b4a30), -0.4, 0.78, -1.1, s); [[-1.1, -1.45], [0.3, -1.45], [-1.1, -0.75], [0.3, -0.75]].forEach(([x, z]) => box(0.06, 0.78, 0.06, M(0x5a3d27), x, 0.39, z, s));
        const radio = new THREE.Group(); radio.position.set(-0.5, 0.81, -1.3); s.add(radio);
        box(0.42, 0.5, 0.26, M(0x2a1d14, { roughness: 0.4 }), 0, 0.25, 0, radio);
        const grill = new THREE.Mesh(new THREE.CircleGeometry(0.13, 32), M(0x8a7a5a, { roughness: 1 })); grill.position.set(0, 0.3, 0.131); radio.add(grill);
        const dial = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.05), new THREE.MeshBasicMaterial({ color: 0xffb65a })); dial.position.set(0, 0.09, 0.131); radio.add(dial);
        cyl(0.025, 0.025, 0.03, M(0x111), 0.15, 0.09, 0.14, radio).rotation.x = Math.PI / 2;
        cyl(0.1, 0.14, 0.04, M(0x3a3a3a), -0.6, 2.75, -0.2, s); const shade = cyl(0.12, 0.3, 0.25, M(0xe8d9b5, { emissive: 0xffc27a, emissiveIntensity: 0.4 }), -0.6, 2.3, -0.2, s);
        const kid = person(19, { top: 0x7a5a3a, pants: 0x3a3a3a, scale: 0.68 }); kid.position.set(-1.35, 0, -0.75); kid.rotation.y = 2.6; s.add(kid);

          dial.material.color.setHSL(0.08, 1, 0.55 + Math.sin(T * 9) * 0.04);

      (function () {

        box(14, 3.6, 0.2, M(0xd9ccb0), 0, 1.8, -7, s); box(0.2, 3.6, 14, M(0xd9ccb0), -5, 1.8, -3, s);
        box(4.2, 1.4, 0.06, M(0x2f4a3a, { roughness: 0.9 }), 0, 1.75, -6.85, s);
        box(0.5, 0.35, 0.3, M(0x3a3028), 3.5, 3.0, -6.8, s); // Lautsprecher
        const spk = new THREE.Mesh(new THREE.CircleGeometry(0.12, 24), M(0x8a7a5a)); spk.position.set(3.5, 3.0, -6.64); s.add(spk);
        box(1.2, 1.1, 0.6, M(0x5a3d27), -1.6, 0.55, -5.6, s); // Pult
        for (let row = 0; row < 4; row++) for (let col = 0; col < 3; col++) {

          box(1.0, 0.05, 0.55, M(0x7a5a3a), x, 0.72, z, s); box(0.9, 0.6, 0.05, M(0x6a4a2e), x, 0.4, z + 0.27, s);
          box(0.26, 0.04, 0.34, M(0xa32a22), x, 0.77, z - 0.05, s); // das gleiche rote Buch
          const p = person(400 + row * 3 + col, { top: 0x6b5a45, pants: 0x2f2f33, scale: 0.66 }); p.position.set(x, 0, z + 0.55); p.rotation.y = Math.PI; s.add(p);
          p.userData.shL.rotation.x = -0.6; p.userData.shR.rotation.x = -0.6; p.userData.head.rotation.x = 0.35;
        }

      // ===== 4. Osten: Kolonne auf weiter Ebene =====
      (function () {
        const s = new THREE.Scene(); s.background = skyTex("#7d8288", "#a3a7aa", "#b9bbbb"); s.fog = new THREE.Fog(0xa9adae, 15, 120);
        s.add(new THREE.HemisphereLight(0xd0d6dc, 0x4d4a40, 0.8)); sun(s, 0xe8eef2, 0.9, [10, 20, 10], 30);
        box(400, 0.1, 400, M(0x5f5a45), 0, -0.05, -100, s);
        box(4, 0.02, 400, M(0x4a3f33), 0, 0.01, -100, s);
        const r = rng(55); const walkers = [];
        for (let i = 0; i < 46; i++) {
          const p = person(600 + i, { top: [0x3b3530, 0x4a4238, 0x2f3238, 0x5a4b3e][i % 4], pants: 0x2a2a2a });
          p.position.set((r() - 0.5) * 2.6, 0, 2 - i * 1.6 - r() * 0.6); p.rotation.y = Math.PI; s.add(p);

      // ===== 5. Lager: Zaun und Wachturm im Nebel (angedeutet, ohne Menschen) =====
      (function () {
        const s = new THREE.Scene(); s.background = new THREE.Color(0x15181d); s.fog = new THREE.Fog(0x1c2026, 6, 45);
        s.add(new THREE.HemisphereLight(0x7a8aa0, 0x151515, 0.7));
        box(200, 0.1, 200, M(0x2a2a28), 0, -0.05, -40, s);
